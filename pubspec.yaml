  app_settings: ^6.1.1
  flutter_animate: ^4.5.0
  wakelock_plus: ^1.1.4
  no_screenshot: ^0.3.1
  url_launcher: ^6.2.6
  sentry_flutter: ^9.8.0
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito : ^5.4.2 # mocking library for testing
  bloc_test : ^10.0.0  # testing for BLoC
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^3.2.0
  flutter_launcher_icons: ^0.13.1

